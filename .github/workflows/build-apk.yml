name: Build Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "If set, also publish a separate named release at this tag (in addition to updating 'latest')"
        required: false
        default: ""
      release_name:
        description: "Title for that named release"
        required: false
        default: ""
      release_notes:
        description: "Body text for that named release"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Web App
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Print debug keystore SHA-1 (for Firebase Console)
        run: |
          echo "=== SHA-1 / SHA-256 for Firebase Console ==="
          keytool -list -v -keystore android/keystore/debug.keystore \
            -alias androiddebugkey -storepass android -keypass android \
            | grep -E "SHA1:|SHA256:"

      - name: Sync Capacitor
        run: |
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sovo-Chat-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Update Latest Release
        uses: ncipollo/release-action@v1
        with:
          name: "S'ovo Chat App (Latest)"
          tag: "latest"
          allowUpdates: true
          removeArtifacts: true
          artifacts: "android/app/build/outputs/apk/debug/app-debug.apk"
          token: ${{ secrets.GITHUB_TOKEN }}
          body: "Direct download link for the latest APK."

      - name: Publish Named Release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag != '' }}
        uses: ncipollo/release-action@v1
        with:
          name: ${{ inputs.release_name }}
          tag: ${{ inputs.release_tag }}
          allowUpdates: true
          artifacts: "android/app/build/outputs/apk/debug/app-debug.apk"
          token: ${{ secrets.GITHUB_TOKEN }}
          body: ${{ inputs.release_notes }}
